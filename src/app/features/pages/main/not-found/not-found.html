<section class="not-found">
    <div class="content">
        <h1>404</h1>
        <h2>{{ 'NOT_FOUND.TITLE' | translate }}</h2>

        <p>{{ 'NOT_FOUND.TEXT' | translate }}</p>

        <div class="actions">
            <a [routerLink]="'/' | localize" routerLinkActive="active" class="btn primary">{{ 'COMMON.BACK_HOME' | translate }}</a>
            <a [routerLink]="'/articles' | localize" routerLinkActive="active" class="btn secondary">{{ 'COMMON.SEE_ARTICLES' | translate }}</a>
        </div>
    </div>
</section>

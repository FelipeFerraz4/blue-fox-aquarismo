<div class="admin">
  <nav class="admin-nav" [attr.aria-label]="'ADMIN.NAV_LABEL' | translate">
    <p class="admin-brand">{{ 'ADMIN.BRAND' | translate }}</p>
    <ul>
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path | localize"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.exact }"
            ariaCurrentWhenActive="page"
            >{{ link.label | translate }}</a
          >
        </li>
      }
    </ul>
    <p class="admin-user muted">{{ auth.getUserFullName() || auth.getUsername() }}</p>
  </nav>

  <div class="admin-main">
    <router-outlet />
  </div>
</div>

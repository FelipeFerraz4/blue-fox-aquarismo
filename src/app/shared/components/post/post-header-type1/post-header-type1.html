<section class="post-header" [style.background-image]="'url(' + imageUrl + ')'">
  <div class="overlay">
    <div class="header-content">
      <span class="category-tag">{{ category }}</span>
      <h1>{{ title }}</h1>
      <p class="description">{{ description }}</p>

      <div class="post-meta">
        <div class="author-info">
          <span class="label">{{ 'POSTS.AUTHOR' | translate }}</span>
          <span class="value">{{ author }}</span>
        </div>
        <div class="separator"></div>
        <div class="date-info">
          <span class="label">{{ 'POSTS.PUBLISHED_AT' | translate }}</span>
          <span class="value">{{ date | localDate }}</span>
        </div>
        <div class="separator"></div>
        <div class="reading-info">
          <span class="icon" aria-hidden="true">⏱</span>
          <span class="value">{{ 'POSTS.READING_TIME' | translate: { time: readingTime } }}</span>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="related-wrapper">
    <div class="container">
        @if (latestPosts.length > 0) {
        <div class="section-header">
            <span class="accent-line"></span>
            <h2>{{ 'POSTS.LATEST' | translate }}</h2>
        </div>

        <div class="posts-grid small">
            @for (post of latestPosts; track post.id) {
            <a [routerLink]="('/articles/' + post.slug) | localize" class="post-card">
                <div class="card-image">
                    <img [src]="post.imageUrl" [alt]="post.title" loading="lazy" />
                    <span class="category-tag">{{ post.categoryName }}</span>
                </div>
                <div class="card-body">
                    <span class="post-date">{{ post.publishedAt | localDate }}</span>
                    <h3>{{ post.title }}</h3>
                    <p>{{ post.description }}</p>
                    <span class="read-more">{{ 'COMMON.READ_ARTICLE' | translate }} →</span>
                </div>
            </a>
            }
        </div>
        }
    </div>
</section>

<div 
  class="carousel-wrapper"
  (mouseenter)="pause()"
  (mouseleave)="resume()"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
  tabindex="0"
  role="region"
  aria-roledescription="carousel"
  aria-label="Carrossel de Destaques">

  <!-- Slides -->
  <div class="slides-container">
    @for (slide of slides; track slide.id; let i = $index) {
      <div 
        class="carousel-slide"
        [class.active]="i === currentIndex()"
        [attr.aria-hidden]="i !== currentIndex()"
        [style.backgroundImage]="'url(' + slide.image + ')'">

        <div class="slide-overlay">
          <div class="slide-content">
            <h1 class="slide-title">{{ slide.title }}</h1>
            <p class="slide-description">{{ slide.description }}</p>

            @if (slide.button) {
              <a class="slide-btn" [routerLink]="slide.button.link">
                {{ slide.button.text }}
                <span class="btn-arrow" aria-hidden="true">→</span>
              </a>
            }
          </div>
        </div>

      </div>
    }
  </div>

  <!-- Controles de Navegação (Next / Prev) -->
  @if (slides.length > 1) {
    <button 
      type="button"
      class="nav-btn prev-btn"
      (click)="prev()"
      aria-label="Slide anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <button 
      type="button"
      class="nav-btn next-btn"
      (click)="next()"
      aria-label="Próximo slide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>

    <!-- Indicadores (Dots / Pills) -->
    <div class="indicators" role="tablist" aria-label="Slides">
      @for (slide of slides; track slide.id; let i = $index) {
        <button
          type="button"
          class="indicator-dot"
          [class.active]="i === currentIndex()"
          (click)="goTo(i)"
          [attr.aria-label]="'Ir para slide ' + (i + 1)"
          [attr.aria-selected]="i === currentIndex()"
          role="tab">
        </button>
      }
    </div>
  }

</div>

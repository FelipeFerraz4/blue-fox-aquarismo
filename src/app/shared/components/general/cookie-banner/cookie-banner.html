@if (showBanner) {
<div class="cookie-banner" role="region" [attr.aria-label]="'COOKIES.REGION' | translate">
    <div class="cookie-text">
        <p>
            {{ 'COOKIES.TEXT' | translate }}
            <a [routerLink]="'/privacy-policy' | localize">{{ 'COOKIES.PRIVACY' | translate }}</a>
            {{ 'COOKIES.AND' | translate }}
            <a [routerLink]="'/terms-of-use' | localize">{{ 'COOKIES.TERMS' | translate }}</a>.
        </p>
    </div>

    <div class="cookie-actions">
        <button type="button" (click)="acceptCookies()">{{ 'COOKIES.ACCEPT' | translate }}</button>
    </div>
</div>
}

<nav class="lang-switch" [attr.aria-label]="'LANGUAGE.LABEL' | translate">
  @for (l of locales; track l.code) {
    <a
      [routerLink]="hrefFor(l.code)"
      [attr.hreflang]="l.code"
      [attr.lang]="l.code"
      [attr.title]="l.label"
      [attr.aria-current]="language.current() === l.code ? 'true' : null"
      (click)="remember(l.code)"
    >
      <!-- Nome acessível "PT, Português": contém o texto visível (WCAG 2.5.3) -->
      {{ l.short }}<span class="sr-only">, {{ l.label }}</span>
    </a>
  }
</nav>

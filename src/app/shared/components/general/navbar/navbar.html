    <a routerLink="/" class="navbar-brand">
      <img src="/assets/images/brand/logo.webp" alt="" />
      <span>Blue Fox Aquarismo</span>
    </a>

    <!-- Botão hamburguer (mobile) -->
    <button type="button" class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen"
      aria-controls="navbar-menu" aria-label="Abrir menu">☰</button>

    <!-- Menu -->
    <nav class="navbar-menu" id="navbar-menu" aria-label="Principal" [class.open]="menuOpen">
      <ul class="menu-list">
        <li>
          <a routerLink="/">Início</a>
        </li>

        <li>
          <a routerLink="/guias">Guias</a>
        </li> -->

          </button>

          <ul class="dropdown" [class.open]="artigosOpen">
            <li><a routerLink="/artigos/agua-doce">Aquários de Água Doce</a></li>
            <li><a routerLink="/artigos">Aquários Plantados</a></li>
            <li><a routerLink="/artigos/marinho">Aquários Marinhos</a></li>
          </ul>
        </li> -->

        <!-- <li class="has-dropdown">
          <button class="dropdown-toggle" (click)="toggleFerramentas()">
            Ferramentas <span class="arrow" [class.open]="ferramentasOpen">▾</span>
          </button>

          <ul class="dropdown" [class.open]="ferramentasOpen">

          </ul>
        </li> -->

        <li>
          <a routerLink="/about">Sobre</a>
        </li>
      </ul>

      <!-- Ações -->
      <div class="navbar-actions">
        <app-navbar-search />

        <div class="auth-actions">
          <!-- NÃO LOGADO -->
          @if (!auth.isLoggedIn()) {
          <button (click)="login()" class="login-btn">
            Login
          </button>
          }

          <!-- LOGADO -->
          @if (auth.isLoggedIn()) {
          <div class="user-info">
            <span class="username">
              Olá, {{ auth.getUserFullName() }}
            </span>

            <button (click)="logout()" class="logout-btn">
              Sair
            </button>
          </div>
          }
        </div>
      </div>
    </nav>
  </div>

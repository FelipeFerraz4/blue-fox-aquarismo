<header class="navbar">
  <div class="navbar-container">
    <!-- Logo / Brand -->
    <a [routerLink]="'/' | localize" class="navbar-brand">
      <img src="/assets/images/brand/logo.webp" alt="" />
      <span>Blue Fox Aquarismo</span>
    </a>

    <!-- Botão hamburguer (mobile) -->
    <button type="button" class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen"
      aria-controls="navbar-menu" [attr.aria-label]="'NAV.OPEN_MENU' | translate">☰</button>

    <!-- Menu -->
    <nav class="navbar-menu" id="navbar-menu" [attr.aria-label]="'NAV.MAIN' | translate" [class.open]="menuOpen">
      <ul class="menu-list">
        <li>
          <a [routerLink]="'/' | localize">{{ 'NAV.HOME' | translate }}</a>
        </li>
        <!-- 
        <li>
          <a [routerLink]="'/guias' | localize">Guias</a>
        </li> -->
        <!-- 
        <li class="has-dropdown">
          <button class="dropdown-toggle" (click)="toggleArtigos()">
            Artigos <span class="arrow" [class.open]="artigosOpen">▾</span>
          </button>

          <ul class="dropdown" [class.open]="artigosOpen">
            <li><a [routerLink]="'/artigos/agua-doce' | localize">Aquários de Água Doce</a></li>
            <li><a [routerLink]="'/artigos' | localize">Aquários Plantados</a></li>
            <li><a [routerLink]="'/artigos/marinho' | localize">Aquários Marinhos</a></li>
          </ul>
        </li> -->

        <!-- <li class="has-dropdown">
          <button class="dropdown-toggle" (click)="toggleFerramentas()">
            Ferramentas <span class="arrow" [class.open]="ferramentasOpen">▾</span>
          </button>

          <ul class="dropdown" [class.open]="ferramentasOpen">
            <li><a [routerLink]="'/ferramentas/montar-aquario' | localize">Montar Aquário</a></li>
            <li><a [routerLink]="'/ferramentas/quiz-peixes' | localize">Quiz de Peixes</a></li>
            <li><a [routerLink]="'/ferramentas/jogos' | localize">Jogos Educativos</a></li>
          </ul>
        </li> -->

        <li>
          <a [routerLink]="'/about' | localize">{{ 'NAV.ABOUT' | translate }}</a>
        </li>
      </ul>

      <!-- Ações -->
      <div class="navbar-actions">
        <app-navbar-search />

        <app-language-switcher />

        <div class="auth-actions">
          <!-- NÃO LOGADO -->
          @if (!auth.isLoggedIn()) {
          <button type="button" (click)="login()" class="login-btn">
            {{ 'NAV.LOGIN' | translate }}
          </button>
          }

          <!-- LOGADO -->
          @if (auth.isLoggedIn()) {
          <div class="user-info">
            <span class="username">
              {{ 'NAV.HELLO' | translate: { name: auth.getUserFullName() } }}
            </span>

            <button type="button" (click)="logout()" class="logout-btn">
              {{ 'NAV.LOGOUT' | translate }}
            </button>
          </div>
          }
        </div>
      </div>
    </nav>
  </div>
</header>

<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>Blue Fox Aquarismo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- Tema e acessibilidade antes do Angular, para não piscar (ver ThemeService/AccessibilityService).
       localStorage: bf-theme (ausente = seguir o sistema), bf-contrast, bf-font-scale. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('bf-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var d = document.documentElement;
        d.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (localStorage.getItem('bf-contrast') === 'high') d.setAttribute('data-contrast', 'high');
        var f = parseFloat(localStorage.getItem('bf-font-scale'));
        if (f >= 0.875 && f <= 1.5) d.style.setProperty('--a11y-font-scale', String(f));
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/png" href="./assets/images/brand/LogoFoxBlue.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
  <app-root></app-root>
</body>

</html>

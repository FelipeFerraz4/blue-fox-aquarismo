services:
  frontend:
    container_name: aquarismo-frontend
    restart: unless-stopped
    build:
      context: .
    expose:
      - "${PORT:-4000}"
    environment:
      - PORT=${PORT:-4000}
      - NODE_ENV=${NODE_ENV:-development}
    networks:
      - infra-net
      - blog-api-net
      - aquarismo-net

networks:
  infra-net:
    name: ${DOCKER_NETWORK:-infra-net}
    external: true
  blog-api-net:
    name: ${BLOG_API_NETWORK:-blue-fox-blog-backend_blog-api-net}
    external: true
  aquarismo-net:
    driver: bridge

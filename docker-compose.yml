services:
  frontend:
    container_name: aquarismo-frontend
    restart: unless-stopped
    build:
      context: .
    expose:
      - "${PORT:-4000}"
    environment:
      - PORT=${PORT:-4000}
      - NODE_ENV=${NODE_ENV:-development}
    networks:
      - infra-net

networks:
  infra-net:
    name: ${DOCKER_NETWORK:-infra-net}
    external: true
